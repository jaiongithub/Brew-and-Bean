<VirtualHost *:80>
    ServerAdmin webmaster@brewandbean.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        DirectoryIndex index.php index.html
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/brew_error.log
    CustomLog ${APACHE_LOG_DIR}/brew_access.log combined
</VirtualHost>

