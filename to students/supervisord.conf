[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mariadb]
command=/usr/bin/mariadbd-safe --datadir=/var/lib/mysql --bind-address=127.0.0.1
user=mysql
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb_err.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2_err.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron_err.log

[program:verifier]
command=/usr/bin/python3 /opt/verifier/app.pyc
directory=/opt/verifier
environment=PYTHONUNBUFFERED="1",WEB_INTERNAL_URL="http://127.0.0.1"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/verifier.log
stderr_logfile=/var/log/supervisor/verifier_err.log

[program:staff-bot]
command=/usr/bin/node /opt/staff-bot/bot.js
directory=/opt/staff-bot
environment=WEB_INTERNAL_URL="http://127.0.0.1",VERIFIER_INTERNAL_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/bot.log
stderr_logfile=/var/log/supervisor/bot_err.log
